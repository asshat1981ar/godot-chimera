name: claude-content-gate

# Content-graph gate for data/*.json.
#  * `graph` (check name: content-graph) is the deterministic verdict: it runs scripts/check_content_graph.py taken from
#    the BASE commit against the PR's data (checked out under pr-head/), with `python3 -I`,
#    no secrets and read-only permissions. It is not skipped for forks or drafts and has no
#    `paths:` filter, so it is safe to require (context: content-graph). It fails closed: the
#    checker missing on base passes only for the PR that introduces it (present in the head);
#    data/ or any data/*.json present on base but missing in the head fails.
#  * `explain` is advisory: Claude reads the report plus the PR's data (Read/Glob/Grep only,
#    no Bash) and adds an explanation. Its output never decides pass/fail; empty output is a
#    WARN. Never make `explain` a required check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  graph:
    name: content-graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: content-graph-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
      report: ${{ steps.check.outputs.report }}
    steps:
      - name: Checkout base (trusted checker)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout PR head (data only, never executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          fetch-depth: 1
          persist-credentials: false

      - name: Check content graph
        id: check
        run: |
          if [ ! -f scripts/check_content_graph.py ]; then
            if [ -f pr-head/scripts/check_content_graph.py ]; then
              echo "verdict=skipped" >> "$GITHUB_OUTPUT"
              echo "report=checker not on base yet" >> "$GITHUB_OUTPUT"
              echo "Content graph: this PR introduces the checker (not on base yet); skipped (passes)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
            echo "report=checker missing on base and head" >> "$GITHUB_OUTPUT"
            echo "::error::scripts/check_content_graph.py is missing on the base branch and in this PR; failing closed. Restore it."
            exit 1
          fi
          if [ ! -d pr-head/data ]; then
            if [ -d data ]; then
              echo "verdict=fail" >> "$GITHUB_OUTPUT"
              echo "report=data dir removed" >> "$GITHUB_OUTPUT"
              echo "::error::data/ exists on the base branch but is missing in this PR; failing closed."
              exit 1
            fi
            echo "verdict=skipped" >> "$GITHUB_OUTPUT"
            echo "report=no data dir" >> "$GITHUB_OUTPUT"
            echo "Content graph: not relevant (no data/ directory on base or head)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rc=0
          python3 -I scripts/check_content_graph.py pr-head/data > "$RUNNER_TEMP/graph.txt" 2>&1 || rc=$?
          # The checker skips optional files that are absent, so a PR deleting one would pass: fail on any
          # data/*.json that exists on base but not in the head.
          if [ -d data ]; then
            while IFS= read -r f; do
              if [ ! -f "pr-head/$f" ]; then
                echo "[removed] $f: present on base, missing in this PR" >> "$RUNNER_TEMP/graph.txt"
                rc=1
              fi
            done < <(find data -type f -name '*.json' | sort)
          fi
          report=$(head -c 8000 "$RUNNER_TEMP/graph.txt" | tr -cd '[:print:]\n')
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "verdict=$([ "$rc" -eq 0 ] && echo pass || echo fail)"
            echo "report<<$delim"
            echo "$report"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Content graph (deterministic)"
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  explain:
    needs: graph
    if: |
      !cancelled() &&
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.graph.outputs.verdict != 'skipped'
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    concurrency:
      group: claude-content-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout PR head (data/ and assets/ only, read-only for Claude)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/
            /assets/

      - name: Drop instruction files from the PR tree
        run: |
          # Claude Code loads nested CLAUDE.md files when it reads files beside them: remove any
          # the PR placed under pr-head/ so PR text stays data.
          find pr-head -path pr-head/.git -prune -o \( -iname 'CLAUDE*.md' -o -iname 'AGENTS.md' -o -name '.claude' -o -name '.mcp.json' \) -print0 | xargs -0 -r rm -rf --

      - name: Write deterministic report
        env:
          REPORT: ${{ needs.graph.outputs.report }}
        run: |
          mkdir -p gate-report
          printf '%s\n' "$REPORT" > gate-report/content-graph.txt

      - name: Explain
        id: explain
        continue-on-error: true
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/content-gate PR_NUMBER: ${{ github.event.pull_request.number }}"
          claude_args: |
            --permission-mode auto
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 15
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Bash,Edit,MultiEdit,Write,WebFetch,WebSearch"
            --json-schema '{"type":"object","required":["summary"],"properties":{"summary":{"type":"string"},"suggested_fixes":{"type":"array","items":{"type":"string"}},"extra_findings":{"type":"array","items":{"type":"string"}}}}'

      - name: Summarise (advisory)
        if: ${{ !cancelled() }}
        env:
          OUT: ${{ steps.explain.outputs.structured_output }}
          VERDICT: ${{ needs.graph.outputs.verdict }}
        run: |
          if [ -z "$OUT" ]; then
            echo "::warning::No Claude verdict (deterministic verdict was: $VERDICT)"
            echo "WARN: no Claude explanation (limit hit or step failed). The deterministic content-graph verdict above is the verdict: $VERDICT." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Content gate: Claude explanation (advisory)"
            echo
            jq -r '.summary' <<<"$OUT"
            echo
            jq -r '(.suggested_fixes // [])[] | "- fix: " + .' <<<"$OUT"
            jq -r '(.extra_findings // [])[] | "- extra: " + .' <<<"$OUT"
          } >> "$GITHUB_STEP_SUMMARY"
