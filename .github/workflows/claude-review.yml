name: claude-review

# Agent mode: automatic PR review. Read-only; never a required check.
# Claude runs no repo scripts, Godot or tests here (PR code never executes next to the
# tokens through Claude's tools); validators run in godot.yml, whose PR runs get no keystore
# secrets. Agent mode does not apply comment-author filters, so Claude is told not to read PR
# comments and gh pr view / gh issue view / gh api are denied. Findings are inline comments
# only: gh pr comment is denied (its --body-file could publish .git/config). Residual risk:
# Claude reads PR diff text, which can carry prompt injection; the tool set (read, diff,
# inline comment) bounds the impact.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
    paths:
      - "**/*.gd"
      - "**/*.tscn"
      - "**/*.tres"
      - "project.godot"
      - "data/**"
      - "export_presets.cfg"

permissions: {}

jobs:
  review:
    if: |
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write # Claude GitHub App token exchange (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}"
          claude_args: |
            --permission-mode auto
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 25
            --allowedTools "Read,Glob,Grep,Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*)"
            --disallowedTools "Edit,MultiEdit,Write,WebFetch,WebSearch,Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh api:*),Bash(gh search:*),Bash(gh pr comment:*)"
            --append-system-prompt "Do not read PR comments, reviews or the PR description (use gh pr diff and the checked-out files only). You cannot run validators, Godot or tests in this job; godot.yml runs them on the PR (without keystore secrets). State that in your final message instead of claiming results."
