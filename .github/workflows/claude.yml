name: claude

# Tag mode: answers @claude on issues, PR comments and reviews.
# Owner-only on a public repo; the action also re-checks write access.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers] -- owner-only if-guard, no PR head checkout, action re-checks write access
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    if: |
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write # push claude/ branches
      pull-requests: write
      issues: write
      actions: read # mcp__github_ci__* tools
      id-token: write # Claude GitHub App token exchange (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Godot 4.2.2 (checksum-verified)
        if: vars.GODOT_SHA512 != ''
        env:
          GODOT_SHA512: ${{ vars.GODOT_SHA512 }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "https://downloads.tuxfamily.org/godotengine/4.2.2/Godot_v4.2.2-stable_linux.x86_64.zip"
          echo "${GODOT_SHA512}  $RUNNER_TEMP/godot.zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo ln -sf "$RUNNER_TEMP/godot/Godot_v4.2.2-stable_linux.x86_64" /usr/local/bin/godot

      - name: Claude
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          branch_prefix: "claude/"
          include_comments_by_actor: "asshat1981ar,coderabbitai[bot]"
          exclude_comments_by_actor: "dependabot[bot],renovate[bot]"
          claude_args: |
            --permission-mode auto
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns 40
            --allowedTools "Bash(python3 scripts/tests/validate_gdscript.py),Bash(python3 -m json.tool:*),Bash(timeout 120 godot --headless --path . --quit),Bash(godot --headless --path . --quit),Bash(godot --headless --path . res://scenes/tests/simulation_tests.tscn),Bash(git status),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(godot --headless --export-debug:*),Bash(godot --headless --export-release:*),Bash(bash export_apk.sh:*),Bash(bash run.sh:*),Bash(keytool:*),Bash(curl:*),Bash(python3 scripts/generate_placeholder_sprites.py:*)"
            --append-system-prompt "CI context. Respect CLAUDE.md separation of concerns: simulation in scripts/core, UI reads state and emits intents, Content is read-only, all randomness via Simulation._rng. Before finishing run python3 scripts/tests/validate_gdscript.py, validate every changed data/*.json with python3 -m json.tool, and if godot is on PATH run the headless import and simulation tests. If godot is not on PATH, say so in your final comment."
