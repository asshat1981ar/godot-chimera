name: claude

# Tag mode: answers @claude on issues, PR comments and reviews.
# Owner-only on a public repo; the action also re-checks write access.
# Trust model: tag mode checks out the PR head, so this job refuses cross-repo (fork)
# PRs, allowlists no build/test/script tools (only read-only git and gh pr diff plus the
# action's own edit and commit tools; godot, python, bash and sh are denied outright) and scrubs
# secrets from subprocess env. gh pr view / gh issue view are denied: they return unfiltered
# comments, bypassing the include/exclude_comments_by_actor filters, which only cover the
# action's own pre-fetched context. Test results come from godot.yml, which runs once a PR is
# open for the branch (not on the bare push). PR runs of godot.yml get no keystore secrets
# (those are passed only on pushes to main/master); they still execute PR code with the
# default read-only GITHUB_TOKEN. Residual risk: on a
# same-repo branch the owner's own content (including @AGENTS.md-style imports and
# files outside the action's base-restore list) is read by Claude; the owner gate
# limits that to branches the owner or Claude pushed.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers] -- owner-only trigger; cross-repo PRs refused by the fork step; no PR code executed (no build/test tools allowlisted); env scrub on
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    if: |
      vars.CLAUDE_PAUSE != 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write # push claude/ branches
      pull-requests: write
      issues: write
      actions: read # mcp__github_ci__* tools
      id-token: write # Claude GitHub App token exchange (OIDC)
    steps:
      - name: Refuse cross-repository PRs
        id: fork
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
        run: |
          cross=true
          if [ "$IS_PR" != "true" ]; then
            cross=false
          elif v=$(gh pr view "$NUM" --repo "$REPO" --json isCrossRepository -q .isCrossRepository) && [ "$v" = "false" ]; then
            cross=false
          fi
          echo "cross=$cross" >> "$GITHUB_OUTPUT"
          if [ "$cross" = "true" ]; then
            echo "::warning::Cross-repository (or unverifiable) PR: Claude was not run"
          fi

      - name: Checkout
        if: steps.fork.outputs.cross != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Claude
        if: steps.fork.outputs.cross != 'true'
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          branch_prefix: "claude/"
          include_comments_by_actor: "asshat1981ar,coderabbitai[bot]"
          exclude_comments_by_actor: "dependabot[bot],renovate[bot]"
          claude_args: |
            --permission-mode auto
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns 40
            --allowedTools "Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr diff:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(curl:*),Bash(gh api:*),Bash(gh search:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(godot:*),Bash(python3:*),Bash(python:*),Bash(bash:*),Bash(sh:*),Bash(make:*),Bash(keytool:*)"
            --append-system-prompt "CI context. Respect CLAUDE.md separation of concerns: simulation in scripts/core, UI reads state and emits intents, Content is read-only, all randomness via Simulation._rng. You cannot run Godot, the Python validators or any tests in this job (by design: no build or test tools are allowlisted). Say so in your final comment; godot.yml and the content gate run once a pull request is open for your branch and report the results there (PR runs receive no keystore secrets). Never stage *.import files or anything under .godot/."
