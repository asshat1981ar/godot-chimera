# Hosts that jobs on GitHub's egress-firewall runner (runs-on: ubuntu-24.04-firewall)
# may reach. Opt in by setting the repo variable CLAUDE_RUNNER=ubuntu-24.04-firewall.
# All other hosts are blocked, apart from any that GitHub's firewall allows by default.
# Add a host only when a workflow step needs it, name it in full (no '*'), and say what uses it.
mode: enforce
allow:
  # Claude API: model requests, and trading the workflow's GitHub identity token for a
  # short-lived API token and the Claude GitHub App token
  - api.anthropic.com
  # GitHub API: calls made by the Claude Code action and by gh in the review and parity jobs
  - api.github.com
  # Claude Code install script, fetched by the Claude Code action
  - claude.ai
  # Claude Code binary, downloaded by the install script
  - downloads.claude.ai
  # Bun and Node.js release downloads used by the action
  - release-assets.githubusercontent.com
  # npm packages installed by the action
  - registry.npmjs.org
  # Godot 4.2.2 download in claude.yml and claude-review.yml (only when GODOT_SHA512 is set)
  - downloads.tuxfamily.org
